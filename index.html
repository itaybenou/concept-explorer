<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local-Global SAE Concept Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <g stroke="#5b6275" stroke-width="1.4">
          <line x1="20" y1="20" x2="20" y2="5"/>
          <line x1="20" y1="20" x2="33" y2="12.5"/>
          <line x1="20" y1="20" x2="33" y2="27.5"/>
          <line x1="20" y1="20" x2="20" y2="35"/>
          <line x1="20" y1="20" x2="7" y2="27.5"/>
          <line x1="20" y1="20" x2="7" y2="12.5"/>
        </g>
        <circle cx="20" cy="5" r="3.6" fill="#ff4d4d"/>
        <circle cx="33" cy="12.5" r="3.6" fill="#ffd23f"/>
        <circle cx="33" cy="27.5" r="3.6" fill="#4ddb6a"/>
        <circle cx="20" cy="35" r="3.6" fill="#3fd7e8"/>
        <circle cx="7" cy="27.5" r="3.6" fill="#4d7bff"/>
        <circle cx="7" cy="12.5" r="3.6" fill="#c45cff"/>
        <circle cx="20" cy="20" r="7" fill="#ffffff"/>
      </svg>
      <span class="title">Local-Global SAE Concept Explorer</span>
    </div>
    <div class="controls">
      <input id="search" list="concept-list" placeholder="Search a concept..." autocomplete="off">
      <datalist id="concept-list"></datalist>
      <button id="reset-btn" title="Show the full graph">Show full graph</button>
      <div class="legend">
        <span><i class="dot global"></i>Global concept</span>
        <span><i class="dot local"></i>Local concept</span>
      </div>
    </div>
  </header>

  <main>
    <div id="cy"></div>
    <div id="loading">Laying out graph...</div>
    <div id="hints">
      <span>Click a node to inspect a concept</span>
      <span>Scroll or pinch to zoom</span>
      <span>Drag the background to pan</span>
      <span>Edge thickness = connection strength</span>
    </div>
    <aside id="panel" class="hidden">
      <button id="close-panel" title="Close">&times;</button>
      <div id="panel-content"></div>
    </aside>
  </main>

  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/layout-base.js"></script>
  <script src="vendor/cose-base.js"></script>
  <script src="vendor/cytoscape-fcose.js"></script>
  <script src="data/graph_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
